name: Trigger Cloudflare report build

on:
  schedule:
    # UTC Monday-Friday 22:30 = Beijing Tuesday-Saturday 06:30.
    - cron: '30 22 * * 1-5'
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/update-report.yml'
      - 'scripts/trigger_deploy_hook.py'
      - 'tests/**'
      - 'cloudflare/**'

permissions:
  contents: read

concurrency:
  group: report-update-${{ github.event.pull_request.number || 'production' }}
  cancel-in-progress: false

jobs:
  update-report:
    name: Validate or trigger Cloudflare build
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out the triggering commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Test Hook triggering and Worker behavior
        if: github.event_name == 'pull_request'
        run: |
          python3 -m unittest discover -s tests -p 'test_*.py'
          node --test tests/worker.test.mjs

      # Cloudflare owns the build and deployment; GitHub only submits the request.
      - name: Request a Cloudflare production build
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          DEPLOY_HOOK_URL: ${{ secrets.DEPLOY_HOOK_URL }}
        run: python3 scripts/trigger_deploy_hook.py
